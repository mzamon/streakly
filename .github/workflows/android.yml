name: Android CI
on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute
        run: chmod +x ./gradlew || true
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace || gradle testDebugUnitTest --stacktrace
      - name: Assemble Debug
        run: ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace
